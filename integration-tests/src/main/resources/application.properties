quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:snello;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.data-management.init-script=test-data.sql
%prod.quarkus.hibernate-orm.data-management.strategy=create

quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.alice=secret
quarkus.security.users.embedded.roles.alice=user

quarkus.http.auth.basic=true
quarkus.http.auth.permission.team.paths=/api/team/*
quarkus.http.auth.permission.team.policy=authenticated
quarkus.http.auth.permission.team-list.paths=/api/team
quarkus.http.auth.permission.team-list.policy=authenticated
